name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Django djangorestframework djangorestframework-simplejwt drf-spectacular whitenoise
      - run: python manage.py test
